[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfextract"
version = "0.1.0"
description = "Pure-Python structured text and metadata extractor for PDF files"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Vaibhav Deshmukh", email = "vdeshmukh203@gmail.com"}]
requires-python = ">=3.8"
keywords = ["pdf", "extraction", "text", "parsing", "research", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]

# No mandatory third-party dependencies; Tkinter (stdlib) is used by the GUI.
dependencies = []

[project.optional-dependencies]
gui = []   # Tkinter ships with CPython; install python3-tk on Linux if absent.
dev = ["pytest>=7"]

[project.scripts]
pdfextract = "pdfextract:_cli"
pdfextract-gui = "pdfextract_gui:main"

[project.urls]
Homepage = "https://github.com/vdeshmukh203/pdfextract"
Repository = "https://github.com/vdeshmukh203/pdfextract"
"Bug Tracker" = "https://github.com/vdeshmukh203/pdfextract/issues"

[tool.setuptools]
py-modules = ["pdfextract", "pdfextract_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
